services:
  - type: web
    name: lead-catcher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: LEADS_DB
        value: /tmp/leads.db
      - key: DATABASE_URL
        fromDatabase:
          name: lead-catcher-db
          property: connectionString

databases:
  - name: lead-catcher-db
    plan: free

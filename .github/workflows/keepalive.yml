# Best-effort keep-awake for the Render free tier (crons can lag/skip under
# GitHub load, and GitHub disables schedules after 60 days without repo
# activity — any commit or manual run re-arms it).
# Prefer an external pinger (UptimeRobot / cron-job.org) hitting /health if
# you already run one — just add this service's URL to it.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 30 "${{ vars.SITE_URL }}/health" || true
